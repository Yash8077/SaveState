name: build-ps5-payload

on:
  # push:
  #   paths:
  #     - "ps5/**"
  #     - ".github/workflows/build-ps5-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SaveState
        uses: actions/checkout@v4

      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wget unzip

      # Install the packaged PS5 payload SDK from ps5-payload-dev/pacbrew-repo.
      # This is the same toolchain used by ps5-payload-dev/fetchpkg and, unlike
      # building only ps5-payload-dev/sdk from source, it includes the PS5 cURL
      # headers, libraries, CA bundle and prospero-curl-config helper.
      - name: Install PS5 payload SDK + cURL stack
        run: |
          wget -q https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar xf ps5-payload-dev.tar.gz -C /

          test -x /opt/ps5-payload-sdk/bin/prospero-curl-config
          /opt/ps5-payload-sdk/bin/prospero-curl-config --cflags
          /opt/ps5-payload-sdk/bin/prospero-curl-config --libs

      - name: Fetch SQLite amalgamation
        working-directory: ps5/activity_logger
        run: |
          curl -fsSL -o sqlite.zip https://sqlite.org/2024/sqlite-amalgamation-3450000.zip

          if ! unzip -t sqlite.zip > /dev/null 2>&1; then
            echo "Downloaded file is not a valid zip archive"
            exit 1
          fi

          unzip -o sqlite.zip
          cp sqlite-amalgamation-*/sqlite3.c sqlite-amalgamation-*/sqlite3.h .

      - name: Build payload
        working-directory: ps5/activity_logger
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          source "$PS5_PAYLOAD_SDK/toolchain/prospero.sh"
          make clean all

      - name: Verify payload artifact
        working-directory: ps5/activity_logger
        run: |
          test -s savestate-activity.elf
          file savestate-activity.elf || true

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: savestate-activity-elf
          path: ps5/activity_logger/savestate-activity.elf
          if-no-files-found: error

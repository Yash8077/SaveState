name: build-ps5-payload

on:
  push:
    paths:
      - "ps5/**"
      - ".github/workflows/build-ps5-payload.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SaveState
        uses: actions/checkout@v4

      - name: Install SDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Checkout ps5-payload-sdk
        uses: actions/checkout@v4
        with:
          repository: ps5-payload-dev/sdk
          path: ps5-payload-sdk-src

      - name: Build + install ps5-payload-sdk
        working-directory: ps5-payload-sdk-src
        env:
          DESTDIR: ${{ runner.tool_cache }}/ps5-payload-sdk
        run: make install

      - name: Fetch SQLite amalgamation
        working-directory: ps5/activity_logger
        run: |
          curl -sSL -o sqlite.zip https://sqlite.org/2024/sqlite-amalgamation-3450000.zip
          
          # Verify the file is a valid zip
          if ! unzip -t sqlite.zip > /dev/null 2>&1; then
            echo "Downloaded file is not a valid zip archive"
            exit 1
          fi
          
          unzip -o sqlite.zip
          cp sqlite-amalgamation-*/sqlite3.c sqlite-amalgamation-*/sqlite3.h .

      - name: Build payload
        working-directory: ps5/activity_logger
        env:
          PS5_PAYLOAD_SDK: ${{ runner.tool_cache }}/ps5-payload-sdk
        run: |
          source "$PS5_PAYLOAD_SDK/toolchain/prospero.sh"
          make clean all

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: savestate-activity-elf
          path: ps5/activity_logger/savestate-activity.elf
          if-no-files-found: error

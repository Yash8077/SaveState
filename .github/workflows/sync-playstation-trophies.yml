name: Sync PlayStation Trophy Catalog

on:
  push:
    branches: [ feature/trophy-sync ]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install trophy sync dependency
        run: npm install --no-save --no-package-lock psn-api@2.18.1

      - name: Sync PlayStation trophy catalog
        env:
          SAVESTATE_URL: ${{ secrets.SAVESTATE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_REFRESH_TOKEN: ${{ secrets.PSN_REFRESH_TOKEN }}
        run: node scripts/sync-playstation-trophies.mjs
